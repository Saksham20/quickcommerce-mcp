[project]
name = "quickcommerce-mcp"
version = "0.1.0"
description = "MCP server that searches Blinkit, Zepto, Instamart, and BigBasket and adds items to the cart."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "playwright>=1.49",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quickcommerce-mcp = "quickcommerce_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
